name: network-monitoring-isp2-probe

services:
  probe:
    image: python:3.13-slim
    container_name: ${PROBE_CONTAINER_NAME}
    command:
      - "sh"
      - "-c"
      - >-
        timeout 30s sh -c 'apt-get update -qq && apt-get install -y -qq traceroute' || true;
        pip install -q -r /probe/requirements.txt && exec python /probe/probe.py
    networks:
      default:
      monitoring-local:
      isp-monitor-macvlan:
        ipv4_address: ${PROBE_IP}
        mac_address: ${PROBE_MAC}
    env_file:
      - .env
    volumes:
      - ./probe.py:/probe/probe.py:ro
      - ../../common/probe.py:/probe/probe_common.py:ro
      - ./requirements.txt:/probe/requirements.txt:ro
      - ./state:/state
    healthcheck:
      test: ["CMD", "python", "-c", "import json, pathlib; json.loads(pathlib.Path('/state/state.json').read_text())"]
      interval: 30s
      timeout: 5s
      retries: 3
    labels:
      wud.watch.digest: "true"
    restart: unless-stopped

networks:
  monitoring-local:
    external: true
  isp-monitor-macvlan:
    external: true

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Network Status</title>
    <link rel="stylesheet" href="/css/status.css" />
  </head>
  <body>
    <header class="page-header">
      <div>
        <h1>Dual-ISP Network Status</h1>
        <p id="generated-at" class="muted">Loading...</p>
      </div>
      <button id="refresh-button" type="button">Refresh</button>
    </header>

    <main>
      <section id="status-cards" class="card-grid" aria-live="polite"></section>

      <section class="panel">
        <div class="panel-header">
          <h2>Outages &amp; Latency</h2>
          <label>
            Days
            <select id="outage-days">
              <option value="1">1</option>
              <option value="7" selected>7</option>
              <option value="14">14</option>
              <option value="30">30</option>
            </select>
          </label>
        </div>
        <h3 class="subsection-title">Outages</h3>
        <div id="outage-charts" class="chart-grid"></div>
        <div id="outage-tables" class="table-grid"></div>
        <h3 class="subsection-title">Probe latency</h3>
        <div id="latency-charts" class="chart-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Speedtest History</h2>
          <label>
            Days
            <select id="speedtest-days">
              <option value="1">1</option>
              <option value="7" selected>7</option>
              <option value="14">14</option>
              <option value="30">30</option>
            </select>
          </label>
        </div>
        <div id="speedtest-charts" class="chart-grid"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>

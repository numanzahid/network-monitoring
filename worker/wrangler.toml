name = "network-monitoring"
main = "src/index.ts"
compatibility_date = "2025-02-24"

[assets]
directory = "./public"
binding = "ASSETS"

[[durable_objects.bindings]]
name = "ISP_STATE"
class_name = "IspState"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IspState"]

[vars]
NOTIFY_ENABLED = "true"
NOTIFIER_CHANNELS = "ntfy"
NOTIFY_AFTER_MISSED_BEATS = "2"
PROBE_INTERVAL_SECONDS = "60"
HEARTBEAT_MAX_AGE_SECONDS = "300"
REMOTE_HISTORY_HOURS = "24"
REMOTE_SPEEDTEST_HISTORY_DAYS = "30"
ISP1_LABEL = "ISP1"
ISP2_LABEL = "ISP2"
STATUS_PAGE_URL = ""
NTFY_SERVER = "https://ntfy.sh"
NTFY_PRIORITY_DOWN = "high"
NTFY_PRIORITY_UP = "default"

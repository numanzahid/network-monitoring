<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Network Monitoring</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/status.css" />
  </head>
  <body>
    <header class="page-header">
      <div>
        <h1>Network Status</h1>
        <p id="generated-at" class="muted">Loading...</p>
      </div>
    </header>

    <main>
      <section id="status-cards" class="card-grid" aria-live="polite"></section>

      <section class="panel">
        <div class="panel-header">
          <h2>Latency</h2>
          <div class="panel-header-actions">
            <button
              type="button"
              id="latency-scale-lock"
              class="panel-toggle"
              aria-pressed="true"
            >
              Peak scale locked
            </button>
            <label class="panel-filter">
              Latency range
              <select id="latency-range">
                <option value="h:1">1 hour</option>
                <option value="h:6" selected>6 hours</option>
                <option value="h:12">12 hours</option>
                <option value="d:1">1 day</option>
                <option value="d:7">7 days</option>
                <option value="d:14">14 days</option>
                <option value="d:30">30 days</option>
              </select>
            </label>
          </div>
        </div>
        <p class="panel-note">Line breaks show periods with no probe heartbeat.</p>
        <div id="latency-charts" class="chart-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Event logs</h2>
          <label class="panel-filter">
            Log days
            <select id="table-days">
              <option value="1" selected>1</option>
              <option value="7">7</option>
              <option value="14">14</option>
              <option value="30">30</option>
            </select>
          </label>
        </div>
        <div id="history-tables" class="table-grid"></div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Speedtest History</h2>
          <label class="panel-filter">
            Speedtest days
            <select id="speedtest-days">
              <option value="1">1</option>
              <option value="7" selected>7</option>
              <option value="14">14</option>
              <option value="30">30</option>
            </select>
          </label>
        </div>
        <div id="speedtest-charts" class="chart-grid"></div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>

name: network-monitoring-isp1-probe

services:
  probe:
    image: python:3.13-slim
    container_name: ${PROBE_CONTAINER_NAME}
    command:
      [
        "sh",
        "-c",
        "apt-get update -qq && apt-get install -y -qq traceroute && pip install -q -r /probe/requirements.txt && python /probe/probe.py",
      ]
    networks:
      isp-monitor-macvlan:
        ipv4_address: ${PROBE_IP}
        mac_address: ${PROBE_MAC}
    env_file:
      - .env
    volumes:
      - ./probe.py:/probe/probe.py:ro
      - ./requirements.txt:/probe/requirements.txt:ro
    labels:
      wud.watch.digest: "true"
    restart: unless-stopped

networks:
  isp-monitor-macvlan:
    external: true
